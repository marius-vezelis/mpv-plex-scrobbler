# Plex server URL (no trailing slash)
plex_url=http://localhost:32400

# Your Plex X-Plex-Token. See README.md for how to obtain it.
token=

# How often (seconds) to send a progress update to Plex while playing.
progress_interval=10

# How long (seconds) to trust the cached library listing before
# re-querying Plex for new/changed files. Default: 1 day.
cache_ttl=86400

# Seek to Plex's saved resume position (viewOffset) when a file starts.
resume_playback=yes

# Minimum Plex viewOffset (seconds) required to bother resuming. Avoids
# jumping a few seconds in for offsets Plex barely considers "started".
resume_threshold=60
